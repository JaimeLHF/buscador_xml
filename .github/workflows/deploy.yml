name: Deploy

# Só publica depois que o workflow "tests" passar na main.
on:
  workflow_run:
    workflows: [tests]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          # Root não loga na VPS (hardening de 09/09). A chave do usuário "deploy" é presa a este script.
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: sudo -n /usr/local/sbin/deploy-buscador-xml
